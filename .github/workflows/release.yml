name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, for example v1.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cleanup regression tests
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File .\tests\Test-Cleanup.ps1
      - name: Space analysis and scheduled cleanup
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File .\tests\Test-Analyzer.ps1 -IncludeTaskRegistration
      - name: Numeric size sorting
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File .\tests\Test-SizeSort.ps1
      - name: Construct interface
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File .\CDriveCleaner.ps1 -UiSmokeTest
      - name: Build release archive
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\Build-Release.ps1
      - name: Publish GitHub release
        # pwsh reads the generated step script as UTF-8; Windows PowerShell 5.1 would
        # decode it as ANSI and garble the Chinese release title.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag: $env:TAG" }
          $asset = "dist/CDriveCleaner-$env:TAG.zip"
          Copy-Item -LiteralPath 'dist/CDriveCleaner.zip' -Destination $asset -Force
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$asset.sha256" -Value ("{0}  CDriveCleaner-{1}.zip" -f $hash, $env:TAG) -Encoding ascii
          $title = "C 盘清理助手 $env:TAG"
          $notes = ".github/release-notes/$env:TAG.md"
          $notesArgs = if (Test-Path -LiteralPath $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            # Re-running for an existing release refreshes its title, notes and assets.
            $editNotes = if (Test-Path -LiteralPath $notes) { @('--notes-file', $notes) } else { @() }
            gh release edit $env:TAG --title $title @editNotes
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed: $LASTEXITCODE" }
            gh release upload $env:TAG $asset "$asset.sha256" --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed: $LASTEXITCODE" }
          } else {
            gh release create $env:TAG $asset "$asset.sha256" --target $env:TARGET --title $title @notesArgs
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed: $LASTEXITCODE" }
          }
